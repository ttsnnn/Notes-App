<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Quick Notes</h1>
    <div>
      <button class="add-note-btn" onclick="openNoteDialog()">+ Add Note</button>
      <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
    </div>
  </header>

  <main id="notes-container" class="notes-grid">

  </main>

  <dialog id="noteDialog">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
        <button class="close-btn" onclick="closeNoteDialog()">x</button>
      </div>

      <formid="noteForm">
        <div class="form-group">
          <label for="noteTitle" class="form-label">Title</label>
          <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title..." required>
        </div>

        <div class="form-group">
          <label for="noteContent" class="form-label"></label>
          <textarea name="" id="noteContent" class="form-textarea" placeholder="Write your note here..." required></textarea>
        </div>

        <div class="dialog-actions">
          <button class="cancel-btn" type="button" onclick="closeNoteDialog()">Cancel</button>
          <button class="save-btn" type="submit">Save Note</button>
        </div>
      </form>
    </div>
  </dialog>

</body>

</html>
